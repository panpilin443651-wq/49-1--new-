<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบคุมค่าใช้จ่าย 49(1)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FDF8F0; --cream2:#F8F1E6; --card:#FFFCF8; --lav:#F3EEFB; --lav2:#EAE0F8;
  --purple:#7C5CBF; --purple-d:#5E43A0; --pastel:#B9A3E3; --border:#E9E0F4;
  --text:#3A3350; --muted:#8B819F;
  --green:#5AA17F; --yellow:#E0B252; --orange:#DE8F4E; --red:#D46A6A;
  --line:#F2ECF9; --hover:#FBF7FF; --row2:#FBF8FE; --input:#FFFFFF; --delhover:#FDEDED;
  --sidebg:linear-gradient(180deg,#F7F1FD,#F1EAFB); --navhover:rgba(255,255,255,.6);
  --c1:#7C5CBF; --c2:#4E9C7F; --c3:#D98B45; --c4:#4A86C5; --c5:#C0679B; --c6:#8C8F3F;
  --r:14px; --sh:0 2px 10px rgba(124,92,191,.08); --sh2:0 6px 24px rgba(124,92,191,.16);
  color-scheme:light;
}
/* ---------- โหมดมืด ---------- */
body.dark{
  --cream:#1E1929; --cream2:#252032; --card:#292234; --lav:#332B45; --lav2:#3E3455;
  --purple:#9E80D6; --purple-d:#C6B2EF; --pastel:#7A62A8; --border:#3B3253;
  --text:#EBE5F7; --muted:#A79BC2;
  --green:#6FBF9A; --yellow:#DEBB72; --orange:#DE9B69; --red:#DE8585;
  --line:#332C46; --hover:#332B45; --row2:#2F2841; --input:#211C2E; --delhover:#40262E;
  --sidebg:linear-gradient(180deg,#241E31,#201A2C); --navhover:rgba(255,255,255,.07);
  --c1:#A98CE0; --c2:#6FBF9A; --c3:#E3A468; --c4:#78ADE4; --c5:#DC90BC; --c6:#B6BA63;
  --sh:0 2px 10px rgba(0,0,0,.3); --sh2:0 8px 26px rgba(0,0,0,.45);
  color-scheme:dark;
}
body.dark .chip.g{background:#28402F;color:#8FD3B0} body.dark .chip.y{background:#40372A;color:#E5C57F}
body.dark .chip.o{background:#43332A;color:#E7AC7C} body.dark .chip.r{background:#432C2E;color:#EC9C9C}
body.dark .chip.mut{background:#332C46;color:var(--muted)}
body.dark .chip{background:#332C46;color:var(--purple-d)}
body.dark .warnbox{background:#3B2E24;border-color:#5A452F;color:#F2DFC9}
body.dark .okbox{background:#25382F;border-color:#3A5747;color:#D5EADF}
body.dark .toast{background:#4A3C6E;color:#F3EDFF}
body.dark .toast.err{background:#7E3B3B}
body.dark .btn.ghost{background:var(--lav)}
body.dark .ovl{background:rgba(10,7,16,.6)}
html,body{height:100%}
body{background:var(--cream);color:var(--text);line-height:1.55;
  font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,-apple-system,sans-serif;font-size:15px;
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--purple-d)}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--sidebg);
  border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .logo{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--pastel));color:#fff;font-weight:700;font-size:13px;
  box-shadow:var(--sh)}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  color:var(--text);font-size:14.5px;text-align:left;width:100%;transition:.15s;position:relative}
.nav button .ico{font-size:17px;width:22px;text-align:center;flex:none}
.nav button:hover{background:var(--navhover)}
.nav button.on{background:linear-gradient(135deg,var(--purple),#8E6FCC);color:#fff;box-shadow:var(--sh)}
.nav .dot{margin-left:auto;background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;
  border-radius:10px;display:grid;place-items:center;padding:0 5px}
.nav button.on .dot{background:#fff;color:var(--red)}
.main{flex:1;min-width:0;padding:20px 22px 40px}
.wrap{max-width:1180px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:-.2px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:-2px}
.spacer{flex:1}
.fybox{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:6px 10px;box-shadow:var(--sh)}
.fybox label{font-size:12.5px;color:var(--muted)}
.fybox select{border:none;background:none;font-weight:700;color:var(--purple-d);outline:none;width:auto;padding:0}

.btn{background:linear-gradient(135deg,var(--purple),#8E6FCC);color:#fff;padding:9px 15px;border-radius:11px;
  font-weight:600;font-size:14px;box-shadow:var(--sh);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.06);box-shadow:var(--sh2)}
.btn.ghost{background:var(--card);color:var(--purple-d);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{background:var(--lav)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{background:linear-gradient(135deg,#D46A6A,#C25858)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:8px 11px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pastel);box-shadow:0 0 0 3px rgba(185,163,227,.25)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px 2px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card+.card{margin-top:14px}
.card h2{font-size:16px;font-weight:700;margin-bottom:2px}
.card .hint{font-size:12.5px;color:var(--muted)}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:14px;align-items:start}
.split>.card{margin-top:0}
.rightcol{min-width:0}
.newexp{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.newexp .field{margin-bottom:0}
.newexp .wide{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--pastel)}
.kpi.k2:before{background:var(--purple)} .kpi.k3:before{background:var(--green)} .kpi.k4:before{background:var(--yellow)}
.kpi .lab{font-size:12.5px;color:var(--muted)}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:3px}

.pbar{height:9px;border-radius:6px;background:var(--lav2);overflow:hidden;margin-top:7px}
.pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pastel),var(--purple));transition:width .4s}
.pbar.g>i{background:linear-gradient(90deg,#7EC2A2,var(--green))}
.pbar.y>i{background:linear-gradient(90deg,#EFCB84,var(--yellow))}
.pbar.o>i{background:linear-gradient(90deg,#EFB183,var(--orange))}
.pbar.r>i{background:linear-gradient(90deg,#E79A9A,var(--red))}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px dashed var(--border)}
.catrow:last-child{border-bottom:none}
.catrow .nm{font-size:14px}
.catrow .amt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.catrow .pbar{grid-column:1/-1}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 6px;
  padding:7px 11px;background:var(--lav);border-radius:10px;font-weight:700;font-size:14px}
.grouphead span{font-weight:600;font-size:13px;color:var(--purple-d);font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--hover)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
td.acts button{padding:4px 8px;border-radius:8px;font-size:13px;color:var(--purple-d)}
td.acts button:hover{background:var(--lav)}
td.acts button.del{color:var(--red)}
td.acts button.del:hover{background:var(--delhover)}
tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none;background:var(--row2)}
.tbl-in{width:100%;border:1px solid transparent;background:var(--input);border-radius:8px;padding:5px 8px;text-align:right;
  font-variant-numeric:tabular-nums;min-width:88px}
.tbl-in:hover{border-color:var(--border)}
.tbl-in:focus{border-color:var(--pastel)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{padding:6px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--lav)}
.seg button.on{background:linear-gradient(135deg,var(--purple),#8E6FCC);color:#fff;font-weight:600}
.up{color:var(--red)} .down{color:var(--green)}
.mcell{font-variant-numeric:tabular-nums;color:var(--purple-d);padding:3px 7px;border-radius:7px;
  border:1px solid transparent;font-size:13.5px;transition:.12s}
.mcell:hover{background:var(--lav);border-color:var(--border);text-decoration:underline;text-underline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.empty .big{font-size:32px;display:block;margin-bottom:6px;opacity:.65}

.chip{display:inline-block;background:var(--lav);color:var(--purple-d);font-size:12px;padding:2px 9px;
  border-radius:20px;white-space:nowrap}
.chip.g{background:#E6F4EE;color:#3E7D63} .chip.y{background:#FBF1DC;color:#96702A}
.chip.o{background:#FBEBDD;color:#9A5A26} .chip.r{background:#FBE7E7;color:#A94848}
.chip.mut{background:#F1EEF5;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;margin-bottom:8px;
  font-size:13.5px;border:1px solid}
.alert .ic{font-size:16px;line-height:1.3}
.alert.r{background:#FDEFEF;border-color:#F3D5D5} .alert.o{background:#FDF2E9;border-color:#F5DFC9}
.alert.y{background:#FCF6E7;border-color:#F1E4C4} .alert.i{background:var(--lav);border-color:var(--border)}
.alert .amt{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}

.ovl{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(58,51,80,.42);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
.ovl.on{display:flex}
.modal{background:var(--cream);border-radius:18px;box-shadow:var(--sh2);width:100%;max-width:620px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--card)}
.modal header h3{font-size:16.5px;font-weight:700}
.modal header button.x{margin-left:auto;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:9px}
.modal header button.x:hover{background:var(--lav)}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--card)}
.warnbox{background:#FDF2E9;border:1px solid #F5DFC9;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.okbox{background:#EAF5F0;border:1px solid #CFE7DC;border-radius:11px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}

.toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--purple-d);color:#fff;padding:10px 15px;border-radius:11px;box-shadow:var(--sh2);
  font-size:13.5px;max-width:min(84vw,360px)}
.toast.err{background:#B95151}

.svgwrap{width:100%;overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dlab{font-size:12.5px;color:var(--muted)}
.dlab b{display:block;font-size:15px;color:var(--text)}

/* ปุ่มซ่อน/แสดงแถบเมนู */
.navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--purple-d);font-size:16px;line-height:1;flex:none;box-shadow:var(--sh)}
.navbtn:hover{background:var(--lav)}
.side .navbtn{margin-left:auto;box-shadow:none}
body.navhide .side{display:none}

@media(max-width:1200px){ .split{grid-template-columns:1fr} }
@media(max-width:980px){ .kpis{grid-template-columns:1fr 1fr} }
@media(max-width:860px){
  .app{display:block}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;z-index:60;
    display:flex;gap:2px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    border-right:none;border-top:1px solid var(--border);box-shadow:0 -3px 14px rgba(124,92,191,.10)}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{flex-direction:column;gap:2px;padding:6px 10px;font-size:10.5px;border-radius:12px;
    min-width:62px;text-align:center;align-items:center}
  .nav button .ico{font-size:18px;width:auto}
  .nav .dot{position:absolute;top:2px;right:5px;margin:0;font-size:10px;min-width:16px;height:16px}
  .main{padding:14px 13px 100px}
  .topbar h1{font-size:19px}
  .grid2,.grid3{grid-template-columns:1fr}
  .modal{max-width:none;border-radius:16px}
  .toasts{right:10px;left:10px;bottom:88px;align-items:stretch}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:11px 12px} .kpi .val{font-size:18px}
  table.rt,table.rt tbody,table.rt tr,table.rt td,table.rt tfoot{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 11px;
    margin-bottom:9px;box-shadow:var(--sh)}
  table.rt td{border:none;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rt td:before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;flex:none}
  table.rt td.acts{justify-content:flex-end;padding-top:7px;border-top:1px dashed var(--border);margin-top:5px}
  table.rt td.acts:before{content:""}
  table.rt tfoot td{background:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">49(1)</div>
      <div><b>คุมค่าใช้จ่าย</b><span>งบ 49(1) ฝศย.</span></div>
      <button class="navbtn" id="navHide" title="ซ่อนแถบเมนู">«</button>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script>
/* ============================================================
   ระบบคุมค่าใช้จ่าย 49(1) — ไฟล์เดียว ทำงานออฟไลน์
   ============================================================ */
"use strict";

/* ---------- หมวดหมู่ (รหัสคงที่ ห้ามแก้ id) ---------- */
/* ---------- หมวดรายจ่ายเริ่มต้น (แก้ไข/เพิ่ม/ลบได้ในหน้า "หมวดรายจ่าย") ---------- */
const DEFAULT_CATS = [
  {id:"A",     parent:"",    name:"หมวดค่าตอบแทนใช้สอยและวัสดุ"},
  {id:"A01",   parent:"A",   name:"ค่าใช้จ่ายเดินทาง"},
  {id:"A02",   parent:"A",   name:"ค่าใช้จ่ายเครื่องถ่ายเอกสาร/ปริ้น"},
  {id:"A03",   parent:"A",   name:"ค่าจ้างเหมาบริการ"},
  {id:"A03-1", parent:"A03", name:"ค่าจ้างเหมาบริการรักษาความปลอดภัย"},
  {id:"A03-2", parent:"A03", name:"ค่าจ้างเหมาบริการตัดหญ้า"},
  {id:"A03-3", parent:"A03", name:"ค่าจ้างเหมาบริการกำจัดปลวก"},
  {id:"A03-4", parent:"A03", name:"ค่าจ้างเหมากำจัดสิ่งปฏิกูล"},
  {id:"A03-5", parent:"A03", name:"ค่าจ้างเหมาตัดแต่งกิ่งไม้"},
  {id:"A03-6", parent:"A03", name:"ค่าจ้างเหมาตำแหน่งพนักงานบริการ ฝศย."},
  {id:"A03-7", parent:"A03", name:"ค่าจ้างเหมาเก็บขยะมูลฝอย"},
  {id:"A03-8", parent:"A03", name:"ค่าจ้างเหมาบริการบำรุงรักษาแอร์"},
  {id:"A03-9", parent:"A03", name:"ค่าจ้างเหมาทำความสะอาดรอบอาคาร"},
  {id:"A04",   parent:"A",   name:"ค่าซ่อมแซมครุภัณฑ์"},
  {id:"A05",   parent:"A",   name:"ค่าซ่อมแซมเครื่องปรับอากาศ"},
  {id:"A06",   parent:"A",   name:"ค่าซ่อมแซมสิ่งก่อสร้าง"},
  {id:"A07",   parent:"A",   name:"ค่าวัสดุเชื้อเพลิง"},
  {id:"A08",   parent:"A",   name:"ค่าวัสดุซ่อมแซมยานพาหนะ"},
  {id:"A09",   parent:"A",   name:"ค่าวัสดุสำนักงาน"},
  {id:"A10",   parent:"A",   name:"ค่าวัสดุไฟฟ้า"},
  {id:"A11",   parent:"A",   name:"ค่าวัสดุงานบ้านและงานครัว"},
  {id:"A12",   parent:"A",   name:"ค่าเบี้ยประกันภัยต่างๆ"},
  {id:"A13",   parent:"A",   name:"ค่าพิธีการและพวงมาลา"},
  {id:"A14",   parent:"A",   name:"ค่าภาษีรถยนต์และรถจักรยานยนต์"},
  {id:"A15",   parent:"A",   name:"ค่าภาษีโรงเรือนและที่ดิน"},
  {id:"A16",   parent:"A",   name:"ค่าเช่าที่ดิน/ที่ราชพัสดุ"},
  {id:"A17",   parent:"A",   name:"ค่ารับรอง"},

];

/* ดัชนีหมวด — สร้างใหม่ทุกครั้งที่มีการแก้ไขหมวด
   CATFLAT = ทุกโหนดเรียงตามลำดับแสดงผล, LEAF = หมวดที่บันทึกเงินได้, GROUPS = หมวดใหญ่ */
let CATFLAT=[], LEAF=[], GROUPS=[], LEAF_IDS=[], CATMAP={}, CAT_LOOKUP={};
function buildCats(){
  CATMAP={}; CATFLAT=[]; LEAF=[]; GROUPS=[];
  const kids={};
  DB.cats.forEach(c=>{ const p=c.parent||""; (kids[p]=kids[p]||[]).push(c); });
  (function walk(pid, depth, group){
    (kids[pid]||[]).forEach(c=>{
      const ch = kids[c.id] || [];
      const rec = {id:c.id, name:c.name, depth:depth, group:(depth===0? c.id : group),
                   parent:c.parent||"", isLeaf:!ch.length, kids:ch.map(x=>x.id)};
      CATMAP[c.id]=rec; CATFLAT.push(rec);
      if(depth===0) GROUPS.push(rec);
      if(ch.length) walk(c.id, depth+1, rec.group); else LEAF.push(rec);
    });
  })("", 0, "");
  CATFLAT.forEach(c=>{ c.groupName = CATMAP[c.group]? CATMAP[c.group].name : ""; });
  LEAF_IDS = LEAF.map(c=>c.id);
  CAT_LOOKUP = {};
  LEAF.forEach(c=>{ CAT_LOOKUP[normalize(c.id)]=c.id; CAT_LOOKUP[normalize(c.name)]=c.id; });
}
function leavesOf(id){
  const n = CATMAP[id]; if(!n) return [];
  if(n.isLeaf) return [id];
  let out=[]; n.kids.forEach(k=>{ out = out.concat(leavesOf(k)); }); return out;
}
function subtreeIds(id){
  const n = CATMAP[id]; if(!n) return [];
  let out=[id]; n.kids.forEach(k=>{ out = out.concat(subtreeIds(k)); }); return out;
}
/* ข้อมูลที่ผูกกับหมวดหนึ่ง (รวมลูกหลาน) — ใช้กันไม่ให้ลบหมวดที่มีข้อมูลอยู่ */
function catUsage(id){
  const all = subtreeIds(id);
  return { expenses: DB.expenses.filter(e=> all.indexOf(e.catId)>=0).length,
           budgets:  DB.budgets.filter(b=> all.indexOf(b.catId)>=0).length,
           children: (CATMAP[id]? CATMAP[id].kids.length : 0) };
}

/* ---------- ปีงบประมาณไทย (ต.ค. -> ก.ย.) ---------- */
const MONTHS = ["ต.ค.","พ.ย.","ธ.ค.","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย."];
const MONTHS_FULL = ["ตุลาคม","พฤศจิกายน","ธันวาคม","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน"];
function fyOfDate(d){ const m=d.getMonth(), be=d.getFullYear()+543; return m>=9? be+1 : be; }
function fmOfDate(d){ const m=d.getMonth(); return m>=9? m-9 : m+3; }
function parseDate(s){ if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d)? null : d; }
function fyOf(str){ const d=parseDate(str); return d? fyOfDate(d) : null; }
function fmOf(str){ const d=parseDate(str); return d? fmOfDate(d) : null; }
const TODAY = new Date();
const FY_NOW = fyOfDate(TODAY), FM_NOW = fmOfDate(TODAY);
function thDate(str){
  const d=parseDate(str); if(!d) return str||"";
  return d.getDate()+" "+MONTHS[fmOfDate(d)]+" "+String(d.getFullYear()+543).slice(-2);
}

const short = n=>{ n=+n||0; const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(a>=1e7?1:2)+" ล้าน";
  if(a>=1e3) return nf0.format(n);
  return nf0.format(n); };
const esc = s=> String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DEFAULT_ORGS = [

  {code:"กรย.", name:"กรย."},
  {code:"กวย.", name:"กวย."}

function blankDB(){

                           years:[], navHidden:false, dark:false },
           orgs: DEFAULT_ORGS.map(o=>({id:uid(), code:o.code, name:o.name, note:""})),

}
/* เติมหน่วยงานมาตรฐานให้ข้อมูลเดิมที่ยังไม่มี (ทำครั้งเดียว) */
function seedOrgs(){
  if(DB.settings.seededOrgs) return;
  DEFAULT_ORGS.forEach(d=>{
    if(!DB.orgs.some(o=> normalize(o.code)===normalize(d.code) || normalize(o.name)===normalize(d.name)))
      DB.orgs.push({id:uid(), code:d.code, name:d.name, note:""});
  });
  DB.settings.seededOrgs = true;
  save();
}
function load(){
  try{

    if(raw){ const d=JSON.parse(raw); DB = Object.assign(blankDB(), d);
      DB.settings = Object.assign({fy:FY_NOW, thresholds:{crit:10,warn:25,watch:50}, years:[], navHidden:false, dark:false}, d.settings||{});
      DB.settings.thresholds = Object.assign({crit:10,warn:25,watch:50}, (d.settings||{}).thresholds||{});
      if(!Array.isArray(DB.settings.years)) DB.settings.years=[];
      ["orgs","budgets","expenses"].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
      if(!Array.isArray(DB.cats) || !DB.cats.length) DB.cats = DEFAULT_CATS.map(c=> Object.assign({}, c));
      buildCats();
      return;
    }
  }catch(e){ console.warn("โหลดข้อมูลไม่สำเร็จ",e); }
  DB = blankDB(); buildCats(); save();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ toast("บันทึกลงเครื่องไม่สำเร็จ: "+e.message, true); }
  }, 60);
}
const FY = ()=> DB.settings.fy;
function fyList(){
  const s = new Set([FY_NOW, FY_NOW+1]);
  DB.expenses.forEach(e=>{ const f=fyOf(e.date); if(f) s.add(f); });
  DB.budgets.forEach(b=> s.add(+b.fy));
  (DB.settings.years||[]).forEach(y=> s.add(+y));
  return [...s].filter(x=>x>2500&&x<2700).sort((a,b)=>a-b);   /* น้อย -> มาก */
}
const orgById = id=> DB.orgs.find(o=>o.id===id) || null;
const orgName = id=>{ const o=orgById(id); if(!o) return "-";
  return (o.code && o.code!==o.name)? o.code+" "+o.name : (o.name || o.code); };
const catName = id=> CATMAP[id]? CATMAP[id].name : (id||"-");

/* ---------- การคำนวณ (คำนวณสดทุกครั้ง ไม่เก็บยอดรวม) ---------- */
function expensesOf(fy){ return DB.expenses.filter(e=> fyOf(e.date)===fy); }
function budgetOf(fy, catId, orgId){
  return DB.budgets.reduce((s,b)=> (+b.fy===fy && b.catId===catId && (!orgId || b.orgId===orgId))? s+(+b.amount||0) : s, 0);
}
function spentOf(fy, catId, orgId){
  const ids = catId? leavesOf(catId) : null;
  return DB.expenses.reduce((s,e)=>{
    if(fyOf(e.date)!==fy) return s;
    if(ids && ids.indexOf(e.catId)<0) return s;
    if(orgId && e.orgId!==orgId) return s;
    return s+(+e.amount||0);
  },0);
}
function budgetTotal(fy, catId, orgId){
  const ids = catId? leavesOf(catId) : LEAF_IDS;
  return ids.reduce((s,id)=> s+budgetOf(fy,id,orgId), 0);
}
function actualMonthly(fy, catId, orgId){
  const ids = catId? leavesOf(catId) : null;
  const out = new Array(12).fill(0);
  DB.expenses.forEach(e=>{
    if(fyOf(e.date)!==fy) return;
    if(ids && ids.indexOf(e.catId)<0) return;
    if(orgId && e.orgId!==orgId) return;
    out[fmOf(e.date)] += (+e.amount||0);
  });
  return out;
}
const cum = arr=>{ let s=0; return arr.map(v=> s+=v); };
/* ระดับเตือนจาก % คงเหลือ */
function levelOf(remainPct){
  const t = DB.settings.thresholds;
  if(remainPct < 0) return "over";
  if(remainPct < t.crit) return "crit";
  if(remainPct < t.warn) return "warn";
  if(remainPct < t.watch) return "watch";
  return "ok";
}

    if(FILT.to && e.date > FILT.to) return false;
    if(FILT.q){
      const q = FILT.q.toLowerCase();
      const hay = [e.docNo,e.note,catName(e.catId),orgName(e.orgId)].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort((a,b)=> a.date<b.date? 1 : a.date>b.date? -1 : 0);
}

      w.dataset.ok="1"; return;

    const el=$("#n_amt"); if(el && el.focus) el.focus();
  };
  if($("#expCsv")) $("#expCsv").onclick=exportExpensesCSV;
  if($("#expClr")) $("#expClr").onclick=()=>{ FILT.q=FILT.cat=FILT.org=FILT.from=FILT.to=""; render(); scrollToExpenses(); };
  document.querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=> expenseForm(DB.expenses.find(x=>x.id===b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{
    const e = DB.expenses.find(x=>x.id===b.dataset.del); if(!e) return;

      "ลบรายการ", ()=>{ DB.expenses = DB.expenses.filter(x=>x.id!==e.id); save(); toast("ลบรายการแล้ว"); render(); });
  });
};

function setBudget(fy, catId, orgId, amount){
  const i = DB.budgets.findIndex(b=> +b.fy===fy && b.catId===catId && b.orgId===orgId);
  if(!(amount>0)){ if(i>=0) DB.budgets.splice(i,1); }
  else if(i>=0) DB.budgets[i].amount = amount;
  else DB.budgets.push({id:uid(), fy:fy, orgId:orgId, catId:catId, amount:amount});
  save();
}
afterRender.budget = ()=>{
  const sel=$("#bOrg"); if(sel) sel.onchange=()=>{ BUDGET_ORG=sel.value; render(); };
  document.querySelectorAll("[data-bud]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const v = Math.round((parseFloat(inp.value)||0)*100)/100;

  if(cp) cp.onclick=()=>{

/* ============================================================
   4.5) แดชบอร์ดเปรียบเทียบรายปี
   ============================================================ */
const CMP = {mode:"spent"};
const CMP_MODES = [
  {id:"spent",  name:"เบิกจ่าย"},
  {id:"budget", name:"งบจัดสรร"},
  {id:"remain", name:"คงเหลือ"},
  {id:"pct",    name:"% เบิกจ่าย"}
];
const yColor = i=> "var(--c"+((i%6)+1)+")";
function cmpValue(fy, catId, org){
  const b = budgetTotal(fy, catId, org), s = spentOf(fy, catId, org);
  return CMP.mode==="budget"? b : CMP.mode==="remain"? b-s : CMP.mode==="pct"? pct(s,b) : s;
}
const cmpFmt = v=> CMP.mode==="pct"? (v>0? v.toFixed(1)+"%" : "-") : (v? money(v) : "-");

/* กราฟแท่ง: งบจัดสรร vs เบิกจ่าย ของแต่ละปี */
function barsYearSVG(years, org){
  const W=720,H=270,L=68,R=16,T=14,B=42, iw=W-L-R, ih=H-T-B;
  const data = years.map(fy=>({fy:fy, b:budgetTotal(fy,null,org), s:spentOf(fy,null,org)}));
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.b,d.s)));
  const y = v=> T+ih-ih*(v/maxV);
  const slot = iw/Math.max(1,years.length), bw = Math.min(52, slot*0.3);
  let g="";
  for(let k=0;k<=4;k++){ const yy=T+ih*k/4;
    g+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
       '<text x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+short(maxV*(1-k/4))+'</text>'; }
  data.forEach((d,i)=>{
    const cx = L + slot*i + slot/2;
    const x1 = cx-bw-3, x2 = cx+3;
    g+='<rect x="'+x1.toFixed(1)+'" y="'+y(d.b).toFixed(1)+'" width="'+bw+'" height="'+(T+ih-y(d.b)).toFixed(1)+'" rx="4" fill="var(--lav2)"><title>ปีงบ '+d.fy+' งบจัดสรร '+money(d.b)+'</title></rect>'+
       '<rect x="'+x2.toFixed(1)+'" y="'+y(d.s).toFixed(1)+'" width="'+bw+'" height="'+(T+ih-y(d.s)).toFixed(1)+'" rx="4" fill="'+yColor(i)+'"><title>ปีงบ '+d.fy+' เบิกจ่าย '+money(d.s)+'</title></rect>'+
       '<text x="'+cx.toFixed(1)+'" y="'+(H-22)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+d.fy+'</text>'+
       '<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+pct(d.s,d.b).toFixed(1)+'%</text>';
  });
  return '<svg width="100%" height="270" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="min-width:560px">'+g+'</svg>';
}
/* กราฟเส้น: เบิกจ่ายสะสมรายเดือน ทุกปีทับกัน */
function linesYearSVG(years, org){
  const W=720,H=280,L=68,R=16,T=14,B=34, iw=W-L-R, ih=H-T-B;
  const series = years.map(fy=> cum(actualMonthly(fy,null,org)));
  const maxV = Math.max(1, ...series.map(a=>Math.max.apply(null,a)));
  const x = i=> L+iw*i/11, y = v=> T+ih-ih*(v/maxV);
  let g="";
  for(let k=0;k<=4;k++){ const yy=T+ih*k/4;
    g+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
       '<text x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+short(maxV*(1-k/4))+'</text>'; }
  MONTHS.forEach((m,i)=> g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+m+'</text>');
  series.forEach((arr,si)=>{
    const d = arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+yColor(si)+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    arr.forEach((v,i)=>{ if(!v && !i) return;
      g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3" fill="var(--card)" stroke="'+yColor(si)+'" stroke-width="2">'+
         '<title>ปีงบ '+years[si]+' ถึง'+MONTHS_FULL[i]+' สะสม '+money(v)+'</title></circle>'; });
  });
  return '<svg width="100%" height="280" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="min-width:620px">'+g+'</svg>';
}

function nextCatCode(parentId){
  const taken = {}; DB.cats.forEach(c=> taken[normalize(c.id)]=1);
  if(!parentId){
    for(let i=0;i<26;i++){ const c=String.fromCharCode(65+i); if(!taken[normalize(c)]) return c; }
    return "G"+Math.floor(Math.random()*900+100);
  }
  const p = CATMAP[parentId];
  if(p && p.depth===0){
    for(let i=1;i<100;i++){ const c=parentId+String(i).padStart(2,"0"); if(!taken[normalize(c)]) return c; }
  }
  for(let i=1;i<200;i++){ const c=parentId+"-"+i; if(!taken[normalize(c)]) return c; }
  return parentId+"-"+uid();
}

  const me = DB.cats.find(c=>c.id===id); if(!me) return;

  const k = sibs.indexOf(me), t = k+dir;
  if(t<0 || t>=sibs.length){ toast("อยู่ปลายสุดแล้ว",1); return; }
  const i = DB.cats.indexOf(me), j = DB.cats.indexOf(sibs[t]);
  DB.cats[i] = sibs[t]; DB.cats[j] = me;
  buildCats(); save(); render();
}

function csvCell(v){
  v = v==null? "" : String(v);
  return /[",\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v;
}
const csvLine = arr=> arr.map(csvCell).join(",");
function parseCSV(text){
  text = text.replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> r.some(x=>String(x).trim()!==""));
}

/* จับคู่หมวด: รับทั้งรหัสและชื่อ */
const normalize = s=> String(s||"").replace(/\s+/g,"").replace(/[่้๊๋็]/g,"").toLowerCase();
function findCat(code, name){
  const a = CAT_LOOKUP[normalize(code)]; if(a) return a;
  const b = CAT_LOOKUP[normalize(name)]; if(b) return b;
  const n = normalize(name);
  if(n){ const hit = LEAF.find(c=> normalize(c.name).indexOf(n)>=0 || n.indexOf(normalize(c.name))>=0); if(hit) return hit.id; }
  return null;
}
function findOrg(txt){
  const n = normalize(txt); if(!n) return null;
  return (DB.orgs.find(o=> normalize(o.code)===n || normalize(o.name)===n ||
    normalize((o.code||"")+" "+o.name)===n) || null);
}
function parseAmount(s){ const v=parseFloat(String(s||"").replace(/[, ฿]/g,"")); return isNaN(v)? NaN : v; }
function parseDateCell(s){
  s = String(s||"").trim(); if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){ let y=+m[1]; if(y>2400) y-=543; return y+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0"); }
  m = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{4})$/);
  if(m){ let y=+m[3]; if(y>2400) y-=543; return y+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
  return null;
}
/* จับคอลัมน์จากหัวตาราง เพื่อให้ไฟล์รูปแบบเก่า (มีคอลัมน์โครงการ) ยังนำเข้าได้ */
const HEAD_ALIAS = {
  date:["วันที่"], org:["หน่วยงาน"], code:["รหัสหมวด","รหัส"], cat:["ชื่อหมวด","หมวด","หมวดรายจ่าย"],
  amount:["จำนวนเงิน","วงเงิน","งบจัดสรร","จำนวน"], doc:["เลขที่เอกสาร","เลขที่"],
  note:["หมายเหตุ"], fy:["ปีงบ","ปีงบประมาณ"]
};
function headIndex(head, fallback){
  const idx = {};
  Object.keys(HEAD_ALIAS).forEach(k=>{
    idx[k] = head.findIndex(h=> HEAD_ALIAS[k].some(a=> normalize(h)===normalize(a)));
  });
  Object.keys(fallback).forEach(k=>{ if(idx[k]<0) idx[k]=fallback[k]; });
  return idx;
}
function importCSV(kind, text){
  const rows = parseCSV(text);
  if(rows.length<2){ toast("ไฟล์ CSV ไม่มีข้อมูล",1); return; }
  const head = rows[0].map(h=>String(h).trim());
  const body = rows.slice(1);
  const IX = kind==="expense"
    ? headIndex(head, {date:0, org:1, code:2, cat:3, amount:4, doc:5, note:6})
    : headIndex(head, {fy:0, org:1, code:2, cat:3, amount:4});
  const at = (r,k)=> IX[k]>=0? r[IX[k]] : "";
  const ok=[], bad=[], newOrgs=new Set();
  body.forEach((r,idx)=>{
    const line = idx+2;
    if(kind==="expense"){
      const date=parseDateCell(at(r,"date")), orgTxt=String(at(r,"org")||"").trim();
      const cat=findCat(at(r,"code"), at(r,"cat")), amt=parseAmount(at(r,"amount"));
      const errs=[];
      if(!date) errs.push("วันที่ไม่ถูกต้อง");
      if(!orgTxt) errs.push("ไม่ระบุหน่วยงาน");
      if(!cat) errs.push("ไม่รู้จักหมวด “"+(at(r,"code")||at(r,"cat")||"")+"”");
      if(isNaN(amt)||amt<=0) errs.push("จำนวนเงินไม่ถูกต้อง");
      if(errs.length){ bad.push({line:line, why:errs.join(" · ")}); return; }
      if(!findOrg(orgTxt)) newOrgs.add(orgTxt);
      const doc=String(at(r,"doc")||"").trim();
      const dup = DB.expenses.some(e=> e.date===date && e.catId===cat && Math.abs((+e.amount||0)-amt)<0.005 &&
        normalize(e.docNo)===normalize(doc));
      ok.push({date:date, orgTxt:orgTxt, catId:cat, amount:Math.round(amt*100)/100, docNo:doc,
        note:String(at(r,"note")||"").trim(), dup:dup, line:line});
    } else {
      const fy=parseInt(String(at(r,"fy")).trim(),10), orgTxt=String(at(r,"org")||"").trim();
      const cat=findCat(at(r,"code"),at(r,"cat")), amt=parseAmount(at(r,"amount"));
      const errs=[];
      if(!(fy>2500&&fy<2700)) errs.push("ปีงบไม่ถูกต้อง");
      if(!orgTxt) errs.push("ไม่ระบุหน่วยงาน");
      if(!cat) errs.push("ไม่รู้จักหมวด “"+(at(r,"code")||at(r,"cat")||"")+"”");
      if(isNaN(amt)) errs.push("วงเงินไม่ถูกต้อง");
      if(errs.length){ bad.push({line:line, why:errs.join(" · ")}); return; }
      if(!findOrg(orgTxt)) newOrgs.add(orgTxt);
      ok.push({fy:fy, orgTxt:orgTxt, catId:cat, amount:Math.round(amt*100)/100, line:line});
    }
  });
  const dupN = ok.filter(x=>x.dup).length;
  let body2 = '<div class="'+(ok.length?"okbox":"warnbox")+'"><b>ตรวจไฟล์แล้ว</b><br>'+
    'นำเข้าได้ <b>'+ok.length+'</b> แถว'+(bad.length? ' · ผิดพลาด <b>'+bad.length+'</b> แถว':'')+
    (dupN? ' · ซ้ำกับข้อมูลเดิม <b>'+dupN+'</b> แถว':'')+
    '<br><span style="color:var(--muted)">หัวตาราง: '+esc(head.join(" | "))+'</span></div>';
  if(newOrgs.size) body2 += '<div class="warnbox">จะสร้างหน่วยงานใหม่ '+newOrgs.size+' รายการ: <b>'+esc([...newOrgs].join(", "))+'</b></div>';
  if(bad.length) body2 += '<div class="tblwrap" style="max-height:180px;overflow:auto"><table><thead><tr><th>บรรทัด</th><th>เหตุผลที่ข้าม</th></tr></thead><tbody>'+
    bad.slice(0,60).map(b=>'<tr><td>'+b.line+'</td><td>'+esc(b.why)+'</td></tr>').join("")+'</tbody></table></div>';
  if(dupN) body2 += '<div class="field" style="margin-top:10px"><label><input type="checkbox" id="imSkipDup" checked style="width:auto"> ข้ามแถวที่ซ้ำกับข้อมูลเดิม ('+dupN+' แถว)</label></div>';
  if(ok.length && kind==="expense") body2 += '<div class="hint">ตัวอย่าง 5 แถวแรก: '+
    ok.slice(0,5).map(x=> esc(thDate(x.date)+" · "+catName(x.catId)+" · "+money(x.amount))).join("<br>")+'</div>';

  openModal("ตรวจก่อนนำเข้า "+(kind==="expense"?"ค่าใช้จ่าย":"งบจัดสรร"), body2,
    '<button class="btn ghost" data-close="1">ยกเลิก</button>'+(ok.length? '<button class="btn" data-ok="1">นำเข้า '+ok.length+' แถว</button>':''),
    ()=>{
      if(!ok.length) return true;
      const skipDup = $("#imSkipDup")? $("#imSkipDup").checked : true;
      const orgIdOf = txt=>{ let o=findOrg(txt); if(!o){ o={id:uid(), code:"", name:txt, note:"นำเข้าจาก CSV"}; DB.orgs.push(o); } return o.id; };
      let n=0;
      ok.forEach(x=>{
        if(kind==="expense"){
          if(x.dup && skipDup) return;
          DB.expenses.push({id:uid(), date:x.date, orgId:orgIdOf(x.orgTxt),
            catId:x.catId, amount:x.amount, docNo:x.docNo, note:x.note}); n++;
        } else { setBudget(x.fy, x.catId, orgIdOf(x.orgTxt), x.amount); n++; }
      });
      save(); toast("นำเข้าสำเร็จ "+n+" แถว"); render(); return true;
    });
}
function pickFile(accept, cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>cb(String(r.result), f.name); r.readAsText(f,"utf-8"); };
  inp.click();
}

    });

function runImport49(){
  if(DB.settings.imported49 === IMPORT49.stamp) return;
  const org = (DB.orgs.find(o=> normalize(o.code)===normalize(IMPORT49.org)) || DB.orgs[0] || {}).id;
  if(!org){ return; }
  /* 1) หมวดที่ยังไม่มี */
  let nCat=0;
  IMPORT49.cats.forEach(c=>{
    if(DB.cats.some(x=>x.id===c.id)) return;
    const last = DB.cats.reduce((k,x,idx)=> x.parent===c.parent? idx : k, -1);
    DB.cats.splice(last>=0? last+1 : DB.cats.length, 0, {id:c.id, parent:c.parent, name:c.name});
    nCat++;
  });
  if(nCat) buildCats();
  /* 2) งบจัดสรร (ทับของเดิมที่ปีงบ+หน่วยงาน+หมวดเดียวกัน) */
  let nBud=0;
  IMPORT49.budgets.forEach(b=>{ if(CATMAP[b[1]]){ setBudget(b[0], b[1], org, b[2]); nBud++; } });
  /* 3) ค่าใช้จ่าย (ข้ามรายการที่ซ้ำกันพอดี) */
  let nExp=0;
  IMPORT49.expenses.forEach(e=>{
    if(!CATMAP[e[1]]) return;
    const dup = DB.expenses.some(x=> x.date===e[0] && x.catId===e[1] && x.orgId===org &&
                                     Math.abs((+x.amount||0)-e[2])<0.005);
    if(dup) return;
    DB.expenses.push({id:uid(), date:e[0], orgId:org, catId:e[1], amount:e[2], docNo:"",
      note:"นำเข้าจากไฟล์ 49(1) · ยอดรวมเดือน"+MONTHS_FULL[fmOf(e[0])]});
    nExp++;
  });
  DB.settings.imported49 = IMPORT49.stamp;
  save();
  if(nBud||nExp||nCat) setTimeout(()=> toast("นำเข้าข้อมูลจากไฟล์ 49(1) แล้ว: งบ "+nBud+" · ค่าใช้จ่าย "+nExp+" รายการ"), 400);
}

load();
